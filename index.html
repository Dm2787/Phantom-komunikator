<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Terminal</title>
    
    <!-- Konfiguracja PWA i ikona dla iPhone (iOS) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Hakerski font i tło */
        body {
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: -0.5px;
            background-color: #050505;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Nakładka Scanlines (Efekt CRT monitora) */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            z-index: 9999;
            opacity: 0.3;
        }

        /* Glitch dla tytułu */
        .glitch {
            position: relative;
            animation: glitch 2s infinite;
            color: #00ffcc;
            text-transform: uppercase;
            font-weight: bold;
        }

        @keyframes glitch {
            0% { transform: translate(0); text-shadow: 0 0 0 #00ffff; }
            2% { transform: translate(-2px, 2px); text-shadow: -2px 0 #ff003c; }
            4% { transform: translate(2px, -2px); text-shadow: 2px 0 #00ffff; }
            6% { transform: translate(-1px, 1px); text-shadow: -1px 0 #ff003c; }
            8% { transform: translate(1px, -1px); text-shadow: 1px 0 #00ffff; }
            10% { transform: translate(0); text-shadow: 0 0 0 #00ffcc; }
            100% { transform: translate(0); text-shadow: 0 0 0 #00ffcc; }
        }

        .screen {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #0a0c10;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
            border: 1px solid #111;
        }

        .hidden {
            display: none !important;
        }

        .login-container {
            padding: 30px;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 20px;
        }

        .login-container h2 {
            color: #ff003c;
            margin-bottom: 10px;
            text-shadow: 0 0 5px rgba(255,0,60,0.5);
            text-transform: uppercase;
        }

        .login-container input {
            width: 100%;
            padding: 14px;
            border-radius: 4px;
            border: 1px solid #333;
            background: #050505;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        
        .login-container input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .login-container button {
            width: 100%;
            padding: 14px;
            border-radius: 4px;
            border: 1px solid #00ffcc;
            background: transparent;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        
        .login-container button:hover {
            background: rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        .chat-header {
            padding: 15px;
            background: #080a0e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .chat-header-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chat-header h3 {
            margin: 0;
            font-size: 16px;
        }

        .typing-indicator {
            font-size: 11px;
            color: #ff003c;
            height: 14px;
            margin-top: 2px;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            50% { opacity: 0; }
        }

        .back-btn {
            background: transparent;
            border: none;
            color: #666;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            cursor: pointer;
        }

        .messages-list {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            /* Stylizacja scrollbara w stylu terminala */
            scrollbar-width: thin;
            scrollbar-color: #333 #000;
        }
        
        .messages-list::-webkit-scrollbar { width: 6px; }
        .messages-list::-webkit-scrollbar-track { background: #000; }
        .messages-list::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .date-divider {
            text-align: center;
            font-size: 11px;
            color: #444;
            margin: 15px 0;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Hakerskie kafelki wiadomości (Zamiast miękkich bąbelków) */
        .message {
            max-width: 80%;
            padding: 10px 14px;
            word-break: break-word;
            position: relative;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-left: 2px solid transparent;
            border-right: 2px solid transparent;
        }

        .message.incoming {
            background: rgba(10, 20, 30, 0.7);
            align-self: flex-start;
            border-left-color: #00ffcc;
            color: #00ffcc;
        }

        .message.outgoing {
            background: rgba(30, 10, 15, 0.7);
            align-self: flex-end;
            border-right-color: #ff003c;
            color: #ff003c;
            text-align: right;
        }

        .message img {
            max-width: 100%;
            border: 1px solid #333;
            display: block;
            cursor: pointer;
            filter: grayscale(80%) contrast(120%);
            transition: 0.3s;
        }
        
        .message img:hover {
            filter: grayscale(0%) contrast(100%);
        }

        .msg-time {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 4px;
            font-family: 'Courier New', Courier, monospace;
        }

        .msg-reactions {
            font-size: 12px;
            background: #000;
            border: 1px solid #333;
            padding: 2px 6px;
            align-self: flex-start;
            margin-top: 4px;
        }
        
        .message.outgoing .msg-reactions {
            align-self: flex-end;
        }

        .chat-input-area {
            display: flex;
            padding: 12px;
            background: #080a0e;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #333;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 4px;
            border: 1px solid #333;
            background: #050505;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            outline: none;
        }
        
        .chat-input-area input[type="text"]:focus {
            border-color: #00ffcc;
        }

        .chat-input-area button {
            background: transparent;
            color: #00ffcc;
            border: 1px solid #333;
            border-radius: 4px;
            width: 42px;
            height: 42px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
        }
        
        .chat-input-area button:hover {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
        }

        #attach-btn {
            color: #666;
        }

        /* Hakerskie Menu Akcji */
        .action-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: #080a0e;
            padding: 20px;
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            box-sizing: border-box;
            border-top: 2px solid #333;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-sheet.visible {
            bottom: 0;
        }

        .reaction-row {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            background: #050505;
            border: 1px solid #222;
            font-size: 24px;
            cursor: pointer;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border: 1px solid #333;
            background: transparent;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: #00ffcc;
            text-align: center;
            text-transform: uppercase;
        }

        .action-btn:hover {
            background: rgba(0, 255, 204, 0.1);
        }

        .action-btn.delete {
            color: #ff003c;
            border-color: #ff003c;
        }
        
        .action-btn.delete:hover {
            background: rgba(255, 0, 60, 0.1);
        }

        .action-btn.cancel {
            color: #666;
            border-color: #222;
        }
    </style>
</head>
<body>
    
    <!-- Nakładka linii skanowania na cały ekran -->
    <div class="scanlines"></div>

    <div id="login-screen" class="screen login-container">
        <h2 class="glitch">PHANTOM_TERMINAL</h2>
        <input type="text" id="username-input" placeholder="> USER_ID (Ty)">
        
        <input type="text" id="recipient-input" placeholder="> TARGET_ID (Odbiorca)">
        
        <button id="start-chat-btn">INITIATE_CONNECTION</button>
    </div>

    <div id="chat-screen" class="screen hidden">
        <header class="chat-header">
            <button class="back-btn" id="back-btn">&lt; ABORT</button>
            <div class="chat-header-info">
                <h3 id="chat-title" class="glitch">SECURE_LINK</h3>
                <div id="typing-indicator" class="typing-indicator"></div>
            </div>
            <div style="width: 40px;"></div>
        </header>

        <div id="messages-list" class="messages-list"></div>

        <div class="chat-input-area">
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <button id="attach-btn" title="Wyślij zdjęcie">[I]</button>
            <input type="text" id="message-input" placeholder="> TRANSMIT_DATA...">
            <button id="send-btn">&gt;</button>
        </div>
    </div>

    <!-- Menu kontekstowe z reakcjami -->
    <div id="custom-action-sheet" class="action-sheet">
        <div class="reaction-row">
            <span onclick="addReaction('⚠️')">⚠️</span>
            <span onclick="addReaction('✔️')">✔️</span>
            <span onclick="addReaction('👁️')">👁️</span>
            <span onclick="addReaction('💀')">💀</span>
            <span onclick="addReaction('🔥')">🔥</span>
        </div>
        <button class="action-btn save" id="action-save" style="display:none;">DOWNLOAD_ASSET</button>
        <button class="action-btn delete" id="action-delete">PURGE_DATA</button>
        <button class="action-btn cancel" id="action-cancel">CANCEL</button>
    </div>

    <script>
        let addReaction; 

        (function() {
            const SUPABASE_URL = 'https://quxvvoajvhbutrzuinvf.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1eHZ2b2FqdmhidXRyenVpbnZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDE5MzAsImV4cCI6MjEwMTYxNzkzMH0.0tJG7Q63XHfehzspnBe-jL7Q3PoNOlqUlPloubQPrCU';
            
            let sbClient = null;
            try {
                sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } catch (e) {
                console.error("SYS_ERR:", e);
            }

            let currentUser = '';
            let chatRecipient = '';
            let selectedMessage = null;
            let lastDate = null;
            let typingChannel = null;
            let typingTimer = null;

            const loginScreen = document.getElementById('login-screen');
            const chatScreen = document.getElementById('chat-screen');
            const usernameInput = document.getElementById('username-input');
            const recipientInput = document.getElementById('recipient-input');
            const startChatBtn = document.getElementById('start-chat-btn');
            const backBtn = document.getElementById('back-btn');
            const chatTitle = document.getElementById('chat-title');
            const typingIndicator = document.getElementById('typing-indicator');

            const messagesList = document.getElementById('messages-list');
            const messageInput = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            const attachBtn = document.getElementById('attach-btn');
            const imageInput = document.getElementById('image-input');

            const actionSheet = document.getElementById('custom-action-sheet');
            const actionSave = document.getElementById('action-save');
            const actionDelete = document.getElementById('action-delete');
            const actionCancel = document.getElementById('action-cancel');

            function formatTime(isoString) {
                const date = new Date(isoString);
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }

            startChatBtn.addEventListener('click', () => {
                currentUser = usernameInput.value.trim().toUpperCase();
                chatRecipient = recipientInput.value.trim().toUpperCase();

                if (!currentUser || !chatRecipient) {
                    alert('SYS_WARN: IDENTIFICATION REQUIRED');
                    return;
                }

                if (!sbClient) {
                    alert('SYS_ERR: DB_OFFLINE');
                    return;
                }

                loginScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
                chatTitle.textContent = `LINK: ${chatRecipient}`;
                lastDate = null;
                initChat();
            });

            backBtn.addEventListener('click', () => {
                if (typingChannel) sbClient.removeChannel(typingChannel);
                chatScreen.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                messagesList.innerHTML = '';
                typingIndicator.textContent = '';
            });

            async function initChat() {
                const { data, error } = await sbClient
                    .from('messages')
                    .select('*')
                    .or(`and(sender.eq.${currentUser},recipient.eq.${chatRecipient}),and(sender.eq.${chatRecipient},recipient.eq.${currentUser})`)
                    .order('created_at', { ascending: true });

                if (error) {
                    console.error('FETCH_ERR:', error);
                    return;
                }

                messagesList.innerHTML = '';
                lastDate = null;
                if (data) data.forEach(msg => appendMessageToDOM(msg));
                scrollToBottom();

                sbClient
                    .channel('public:messages')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                        const msg = payload.new;
                        const isRelevant = (msg.sender === currentUser && msg.recipient === chatRecipient) || 
                                           (msg.sender === chatRecipient && msg.recipient === currentUser);
                        if (isRelevant) {
                            appendMessageToDOM(msg);
                            scrollToBottom();
                        }
                    })
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, payload => {
                        updateMessageInDOM(payload.new);
                    })
                    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, payload => {
                        const el = document.querySelector(`[data-id="${payload.old.id}"]`);
                        if (el) el.remove();
                    })
                    .subscribe();

                const roomName = `room_${[currentUser, chatRecipient].sort().join('_')}`;
                typingChannel = sbClient.channel(roomName);
                
                typingChannel
                    .on('broadcast', { event: 'typing' }, payload => {
                        if (payload.payload.user === chatRecipient) {
                            typingIndicator.textContent = `[${chatRecipient} IS_TYPING...]`;
                            clearTimeout(typingTimer);
                            typingTimer = setTimeout(() => {
                                typingIndicator.textContent = '';
                            }, 2000);
                        }
                    })
                    .subscribe();
            }

            messageInput.addEventListener('input', () => {
                if (typingChannel) {
                    typingChannel.send({
                        type: 'broadcast',
                        event: 'typing',
                        payload: { user: currentUser }
                    });
                }
            });

            function appendMessageToDOM(msg) {
                if (document.querySelector(`[data-id="${msg.id}"]`)) {
                    updateMessageInDOM(msg);
                    return;
                }

                const msgDate = new Date(msg.created_at).toLocaleDateString();
                if (msgDate !== lastDate) {
                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'date-divider';
                    const todayStr = new Date().toLocaleDateString();
                    dateDiv.textContent = (msgDate === todayStr) ? '>> LOG: TODAY' : `>> LOG: ${msgDate}`;
                    messagesList.appendChild(dateDiv);
                    lastDate = msgDate;
                }

                const div = document.createElement('div');
                div.className = `message ${msg.sender === currentUser ? 'outgoing' : 'incoming'}`;
                div.setAttribute('data-id', msg.id);

                const contentDiv = document.createElement('div');
                if (msg.type === 'image') {
                    const img = document.createElement('img');
                    img.src = msg.content;
                    contentDiv.appendChild(img);
                    setupLongPress(div, msg, true);
                } else {
                    // Maszynowe wpisywanie przy nowych wiadomościach (dla klimatu)
                    contentDiv.textContent = msg.content;
                    setupLongPress(div, msg, false);
                }
                div.appendChild(contentDiv);

                const reactDiv = document.createElement('div');
                reactDiv.className = 'msg-reactions';
                reactDiv.style.display = 'none';
                div.appendChild(reactDiv);

                const timeDiv = document.createElement('div');
                timeDiv.className = 'msg-time';
                timeDiv.textContent = `[${formatTime(msg.created_at)}]`;
                div.appendChild(timeDiv);

                messagesList.appendChild(div);
                renderReactions(div, msg.reactions);
            }

            function updateMessageInDOM(msg) {
                const div = document.querySelector(`[data-id="${msg.id}"]`);
                if (!div) return;
                renderReactions(div, msg.reactions);
            }

            function renderReactions(div, reactions) {
                let reactDiv = div.querySelector('.msg-reactions');
                if (!reactions || Object.keys(reactions).length === 0) {
                    if (reactDiv) reactDiv.style.display = 'none';
                    return;
                }
                let summary = Object.values(reactions).join(' ');
                if (reactDiv) {
                    reactDiv.textContent = summary;
                    reactDiv.style.display = 'block';
                }
            }

            function scrollToBottom() {
                messagesList.scrollTop = messagesList.scrollHeight;
            }

            async function sendTextMessage() {
                const text = messageInput.value.trim();
                if (!text) return;

                const { error } = await sbClient
                    .from('messages')
                    .insert([{ 
                        sender: currentUser, 
                        recipient: chatRecipient, 
                        content: text, 
                        type: 'text',
                        reactions: {} 
                    }]);

                if (!error) {
                    messageInput.value = '';
                }
            }

            sendBtn.addEventListener('click', sendTextMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendTextMessage();
            });

            attachBtn.addEventListener('click', () => imageInput.click());

            imageInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const compressedBlob = await compressImage(file, 1200, 0.8);
                const fileName = `DATA_${Date.now()}_${Math.random().toString(36).substring(2)}.webp`;

                const { error: uploadError } = await sbClient.storage
                    .from('chat-images')
                    .upload(fileName, compressedBlob);

                if (uploadError) {
                    alert('UPLOAD_ERR: ' + uploadError.message);
                    return;
                }

                const { data: publicUrlData } = sbClient.storage
                    .from('chat-images')
                    .getPublicUrl(fileName);

                await sbClient
                    .from('messages')
                    .insert([{ 
                        sender: currentUser, 
                        recipient: chatRecipient,
                        content: publicUrlData.publicUrl, 
                        type: 'image',
                        reactions: {}
                    }]);

                imageInput.value = '';
            });

            function compressImage(file, maxWidth, quality) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;

                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            canvas.toBlob((blob) => {
                                resolve(blob);
                            }, 'image/webp', quality);
                        };
                    };
                });
            }

            function setupLongPress(element, messageData, isImage) {
                let pressTimer = null;

                const start = () => {
                    if (pressTimer !== null) return;
                    pressTimer = setTimeout(() => {
                        selectedMessage = messageData;
                        if (navigator.vibrate) navigator.vibrate(40);
                        
                        actionSave.style.display = isImage ? 'block' : 'none';
                        actionSheet.classList.add('visible');
                    }, 500);
                };

                const cancel = () => {
                    if (pressTimer !== null) {
                        clearTimeout(pressTimer);
                        pressTimer = null;
                    }
                };

                element.addEventListener('touchstart', start, { passive: true });
                element.addEventListener('touchend', cancel);
                element.addEventListener('touchmove', cancel);
                element.addEventListener('mousedown', start);
                element.addEventListener('mouseup', cancel);
                element.addEventListener('mouseleave', cancel);
            }

            addReaction = async function(emoji) {
                if (!selectedMessage) return;
                actionSheet.classList.remove('visible');

                let currentReactions = selectedMessage.reactions || {};
                currentReactions[currentUser] = emoji;

                await sbClient
                    .from('messages')
                    .update({ reactions: currentReactions })
                    .eq('id', selectedMessage.id);

                selectedMessage = null;
            };

            actionCancel.addEventListener('click', () => {
                actionSheet.classList.remove('visible');
                selectedMessage = null;
            });

            actionSave.addEventListener('click', async () => {
                if (!selectedMessage || selectedMessage.type !== 'image') return;
                actionSheet.classList.remove('visible');

                try {
                    const response = await fetch(selectedMessage.content);
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `ASSET_${Date.now()}.webp`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                } catch (err) {
                    alert('DOWNLOAD_ERR');
                }
            });

            actionDelete.addEventListener('click', async () => {
                if (!selectedMessage) return;
                actionSheet.classList.remove('visible');

                await sbClient
                    .from('messages')
                    .delete()
                    .eq('id', selectedMessage.id);

                selectedMessage = null;
            });
        })();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('SYS_LOG: SW_ACTIVE'))
                    .catch(err => console.log('SYS_ERR: SW_FAIL', err));
            });
        }
    </script>
</body>
</html>

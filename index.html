<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Terminal</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: -0.5px;
            background-color: #050505;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            z-index: 9999;
            opacity: 0.3;
        }

        .update-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 0, 60, 0.9);
            color: #050505;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            z-index: 10000;
            cursor: pointer;
            box-sizing: border-box;
            border-bottom: 2px solid #ff003c;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(255, 0, 60, 0.4);
            animation: alertPulse 1.5s infinite;
        }
        @keyframes alertPulse {
            0% { background: rgba(255, 0, 60, 0.9); }
            50% { background: rgba(200, 0, 40, 0.9); }
            100% { background: rgba(255, 0, 60, 0.9); }
        }

        .glitch {
            position: relative;
            animation: glitch 2s infinite;
            color: #00ffcc;
            text-transform: uppercase;
            font-weight: bold;
        }

        @keyframes glitch {
            0% { transform: translate(0); text-shadow: 0 0 0 #00ffff; }
            2% { transform: translate(-2px, 2px); text-shadow: -2px 0 #ff003c; }
            4% { transform: translate(2px, -2px); text-shadow: 2px 0 #00ffff; }
            6% { transform: translate(-1px, 1px); text-shadow: -1px 0 #ff003c; }
            8% { transform: translate(1px, -1px); text-shadow: 1px 0 #00ffff; }
            10% { transform: translate(0); text-shadow: 0 0 0 #00ffcc; }
            100% { transform: translate(0); text-shadow: 0 0 0 #00ffcc; }
        }

        .screen {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #0a0c10;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
            border: 1px solid #111;
        }

        .hidden {
            display: none !important;
        }

        .login-container {
            padding: 30px;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 20px;
        }

        .login-container h2 {
            color: #ff003c;
            margin-bottom: 10px;
            text-shadow: 0 0 5px rgba(255,0,60,0.5);
            text-transform: uppercase;
        }

        .login-container input {
            width: 100%;
            padding: 14px;
            border-radius: 4px;
            border: 1px solid #333;
            background: #050505;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        
        .login-container input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .login-container button {
            width: 100%;
            padding: 14px;
            border-radius: 4px;
            border: 1px solid #00ffcc;
            background: transparent;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            margin-top: 10px;
        }
        
        .login-container button:hover {
            background: rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        .chat-header {
            padding: 15px;
            background: #080a0e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        .chat-header-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chat-header h3 {
            margin: 0;
            font-size: 16px;
        }

        .status-indicator {
            font-size: 10px;
            margin-top: 4px;
            color: #666;
            transition: 0.3s;
            font-weight: bold;
        }
        
        .status-indicator.online {
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
        }

        .typing-indicator {
            font-size: 11px;
            color: #ff003c;
            min-height: 14px;
            padding: 0 15px 8px 15px;
            animation: blink 1s infinite;
            flex-shrink: 0;
        }
        
        @keyframes blink {
            50% { opacity: 0; }
        }

        .back-btn {
            background: transparent;
            border: none;
            color: #666;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            cursor: pointer;
        }

        .messages-list {
            flex: 1 1 auto;
            min-height: 0;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: thin;
            scrollbar-color: #333 #000;
        }
        
        .messages-list::-webkit-scrollbar { width: 6px; }
        .messages-list::-webkit-scrollbar-track { background: #000; }
        .messages-list::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .date-divider {
            text-align: center;
            font-size: 11px;
            color: #444;
            margin: 15px 0;
            font-weight: bold;
            text-transform: uppercase;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            word-break: break-word;
            position: relative;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-left: 2px solid transparent;
            border-right: 2px solid transparent;
            
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .message.incoming {
            background: rgba(10, 20, 30, 0.7);
            align-self: flex-start;
            border-left-color: #00ffcc;
            color: #00ffcc;
        }

        .message.outgoing {
            background: rgba(30, 10, 15, 0.7);
            align-self: flex-end;
            border-right-color: #ff003c;
            color: #ff003c;
            text-align: right;
        }

        .message .corrupted {
            color: #ff003c;
            font-style: italic;
            text-shadow: 2px 0 2px rgba(255,0,0,0.5), -2px 0 2px rgba(0,255,255,0.5);
            animation: glitch-text 0.5s infinite;
        }

        @keyframes glitch-text {
            0% { opacity: 1; }
            50% { opacity: 0.8; transform: skewX(-5deg); }
            100% { opacity: 1; transform: skewX(0); }
        }

        .message img {
            max-width: 100%;
            border: 1px solid #333;
            display: block;
            cursor: pointer;
            filter: grayscale(80%) contrast(120%);
            transition: 0.3s;
        }
        
        .message img:hover {
            filter: grayscale(0%) contrast(100%);
        }

        .msg-time {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 4px;
            font-family: 'Courier New', Courier, monospace;
        }

        .msg-status {
            font-weight: bold;
            opacity: 0.6;
            margin-left: 6px;
        }
        .msg-status.read {
            opacity: 1;
            color: #fff;
            text-shadow: 0 0 5px #fff;
        }

        .msg-reactions {
            font-size: 14px;
            background: #000;
            border: 1px solid #333;
            padding: 2px 6px;
            align-self: flex-start;
            margin-top: 4px;
        }
        
        .message.outgoing .msg-reactions {
            align-self: flex-end;
        }

        .chat-input-area {
            display: flex;
            padding: 12px;
            background: #080a0e;
            gap: 8px;
            align-items: flex-end; 
            border-top: 1px solid #333;
            flex-shrink: 0;
        }

        .message-display {
            flex: 1;
            padding: 12px 10px;
            border-radius: 4px;
            border: 1px solid #333;
            background: #050505;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            cursor: text;
            white-space: pre-wrap; 
            word-wrap: break-word;
            overflow-y: auto;
            max-height: 120px; 
            min-height: 20px; 
            line-height: 1.4;
            text-align: left;
            overflow-x: hidden;
        }
        .message-display::-webkit-scrollbar { display: none; }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .fake-cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: #00ffcc;
            vertical-align: middle;
            animation: cursorBlink 1s step-end infinite;
            margin-left: 2px;
            box-shadow: 0 0 5px #00ffcc;
        }

        .cyan-emote {
            width: 1.4em;
            height: 1.4em;
            vertical-align: middle;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin: 0 2px;
            display: inline-block;
            transform: translateY(-2px);
        }

        .ghost-keyboard {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px 6px 15px 6px;
            background: #050505;
            border-top: 1px solid #00ffcc;
            box-shadow: 0 -5px 25px rgba(0, 255, 204, 0.15);
        }
        
        .ghost-keyboard.hidden {
            display: none !important;
        }

        .ghost-keyboard.animating {
            animation: kb-glitch-slide 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .ghost-keyboard.hiding {
            animation: kb-slide-down 0.15s ease-in forwards;
        }

        @keyframes kb-glitch-slide {
            0% { transform: translateY(100%); opacity: 0; filter: contrast(2) drop-shadow(3px 0 0 #ff003c) drop-shadow(-3px 0 0 #00ffcc); }
            40% { transform: translateY(-5%); opacity: 1; filter: contrast(1.5) drop-shadow(3px 0 0 #ff003c) drop-shadow(-3px 0 0 #00ffcc) skewX(15deg); }
            60% { transform: translateY(2%); filter: skewX(-10deg); }
            80% { transform: translateY(-1%); filter: skewX(5deg); }
            100% { transform: translateY(0); filter: skewX(0) drop-shadow(0 0 0 transparent); }
        }

        @keyframes kb-slide-down {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }

        .kb-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .kb-key {
            flex: 1;
            background: #0a0c10;
            border: 1px solid #333;
            color: #00ffcc;
            padding: 16px 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            touch-action: manipulation; 
            position: relative;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .kb-key.spec {
            background: #111;
            color: #666;
            font-size: 14px;
        }
        
        .kb-key.clicked {
            animation: key-strike 0.15s ease-out;
        }
        @keyframes key-strike {
            0% { transform: scale(1); background: #0a0c10; color: #00ffcc; }
            30% { transform: scale(0.85); background: #00ffcc; color: #000; box-shadow: 0 0 20px #00ffcc; border-color: #00ffcc; z-index: 10; }
            100% { transform: scale(1); background: #0a0c10; color: #00ffcc; box-shadow: none; border-color: #333; z-index: 1; }
        }

        .kb-key.spec.clicked {
            animation: key-strike-spec 0.15s ease-out;
        }
        @keyframes key-strike-spec {
            0% { transform: scale(1); background: #111; color: #666; }
            30% { transform: scale(0.85); background: #ff003c; color: #fff; box-shadow: 0 0 20px #ff003c; border-color: #ff003c; z-index: 10; }
            100% { transform: scale(1); background: #111; color: #666; box-shadow: none; border-color: #333; z-index: 1; }
        }

        .chat-input-area button {
            background: transparent;
            color: #00ffcc;
            border: 1px solid #333;
            border-radius: 4px;
            width: 40px;
            height: 40px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
            margin-bottom: 2px;
        }
        
        .chat-input-area button:hover {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
        }

        #attach-btn { color: #666; }

        .voice-btn.recording {
            background: #ff003c !important;
            color: white !important;
            border-color: #ff003c !important;
            box-shadow: 0 0 10px #ff003c;
        }

        .burn-btn.active {
            background: #ff4500 !important;
            color: #fff !important;
            border-color: #ff4500 !important;
            box-shadow: 0 0 15px #ff4500;
            animation: pulse-fire 1s infinite alternate;
        }

        @keyframes pulse-fire {
            from { box-shadow: 0 0 5px #ff4500; }
            to { box-shadow: 0 0 15px #ff0000; }
        }

        .burn-timer {
            font-size: 11px;
            color: #ff4500;
            font-weight: bold;
            margin-top: 5px;
            text-align: right;
            letter-spacing: 1px;
            animation: blink 1s infinite;
        }

        .message.glitch-out {
            animation: destroy-msg 0.5s forwards;
            pointer-events: none;
            will-change: transform, opacity, filter;
            transform: translateZ(0); 
        }

        @keyframes destroy-msg {
            0% { transform: skewX(0deg); opacity: 1; filter: contrast(1); }
            20% { transform: skewX(-20deg); opacity: 0.8; filter: contrast(5) hue-rotate(90deg); }
            40% { transform: skewX(20deg); opacity: 0.6; filter: invert(1); background: #ff003c; }
            60% { transform: scaleY(0.1); opacity: 0.4; }
            80% { transform: scaleX(2); opacity: 0.2; }
            100% { transform: scale(0); opacity: 0; margin: 0; padding: 0; height: 0; }
        }

        audio {
            width: 240px;
            max-width: 100%;
            height: 44px;
            margin-top: 8px;
            outline: none;
            border-radius: 22px;
            background-color: #f1f3f4;
        }

        .action-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: #080a0e;
            padding: 20px;
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            box-sizing: border-box;
            border-top: 2px solid #333;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-sheet.visible {
            bottom: 0;
        }

        .reaction-row {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            background: #050505;
            border: 1px solid #222;
            font-size: 24px;
            cursor: pointer;
            color: #00ffcc;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border: 1px solid #333;
            background: transparent;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: #00ffcc;
            text-align: center;
            text-transform: uppercase;
        }

        .action-btn:hover { background: rgba(0, 255, 204, 0.1); }
        .action-btn.delete { color: #ff003c; border-color: #ff003c; }
        .action-btn.delete:hover { background: rgba(255, 0, 60, 0.1); }
        .action-btn.cancel { color: #666; border-color: #222; }
    </style>
</head>
<body>
    
    <div id="update-banner" class="update-banner hidden" onclick="rebootApp()">
        [!] SYS_UPDATE_DETECTED - TAP_TO_REBOOT [!]
    </div>

    <div class="scanlines"></div>

    <div id="login-screen" class="screen login-container">
        <h2 class="glitch">PHANTOM_TERMINAL</h2>
        <input type="text" id="username-input" placeholder="> USER_ID (Ty)">
        <input type="text" id="recipient-input" placeholder="> TARGET_ID (Odbiorca)">
        
        <input type="text" id="secret-pin-input" placeholder="> ENCRYPTION_KEY (PIN)" autocomplete="off" spellcheck="false" style="-webkit-text-security: disc;">
        
        <button id="start-chat-btn">INITIATE_CONNECTION</button>
    </div>

    <div id="chat-screen" class="screen hidden">
        <header class="chat-header">
            <button class="back-btn" id="back-btn">&lt; ABORT</button>
            <div class="chat-header-info">
                <h3 id="chat-title" class="glitch">SECURE_LINK</h3>
                <div id="status-indicator" class="status-indicator">[TARGET: OFFLINE]</div>
            </div>
            <div style="width: 40px;"></div>
        </header>

        <div id="messages-list" class="messages-list"></div>

        <div id="typing-indicator" class="typing-indicator"></div>

        <div class="chat-input-area">
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <button id="attach-btn" title="Wyślij zdjęcie">[I]</button>
            
            <div id="message-display" class="message-display">> TRANSMIT_DATA...<span class="fake-cursor"></span></div>
            
            <button id="burn-btn" class="burn-btn" title="Tryb Autodestrukcji">[🔥]</button>
            <button id="voice-btn" class="voice-btn" title="Wiadomość Głosowa">[M]</button>
            <button id="send-btn">&gt;</button>
        </div>
        
        <div id="ghost-keyboard" class="ghost-keyboard hidden"></div>
    </div>

    <div id="custom-action-sheet" class="action-sheet">
        <div class="reaction-row">
            <span onclick="addReaction('👍')">👍</span>
            <span onclick="addReaction('👎')">👎</span>
            <span onclick="addReaction('🙂')">🙂</span>
            <span onclick="addReaction('😂')">😂</span>
            <span onclick="addReaction('♥')">♥</span>
        </div>
        <div class="reaction-row" style="border-top: none; padding-top: 0;">
            <span onclick="addReaction('🔥')">🔥</span>
            <span onclick="addReaction('💀')">💀</span>
            <span onclick="addReaction('⚠')">⚠</span>
            <span onclick="addReaction('🚀')">🚀</span>
            <span onclick="addReaction('✔')">✔</span>
        </div>
        
        <button class="action-btn save" id="action-save" style="display:none;">DOWNLOAD_ASSET</button>
        <button class="action-btn delete" id="action-delete">PURGE_DATA</button>
        <button class="action-btn cancel" id="action-cancel">CANCEL</button>
    </div>

    <script>
        async function requestNotificationPermission() {
            if (!("Notification" in window)) return;
            if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                await Notification.requestPermission();
            }
        }

        let addReaction;
        let audioCtx = null;
        let failedAttempts = 0; 

        const emojiMap = {
            '🙂': `<svg viewBox="0 0 24 24" class="cyan-emote"><circle cx="12" cy="12" r="10"/><line x1="8" y1="9" x2="8" y2="9" stroke-width="3"/><line x1="16" y1="9" x2="16" y2="9" stroke-width="3"/><path d="M8 15 Q12 19 16 15"/></svg>`,
            '😂': `<svg viewBox="0 0 24 24" class="cyan-emote"><circle cx="12" cy="12" r="10"/><path d="M6 9 Q8 7 10 9"/><path d="M14 9 Q16 7 18 9"/><path d="M8 15 Q12 20 16 15"/><path d="M5 13 Q4 15 6 15 Q7 13 5 13" fill="currentColor" stroke="none"/><path d="M19 13 Q20 15 18 15 Q17 13 19 13" fill="currentColor" stroke="none"/></svg>`,
            '😎': `<svg viewBox="0 0 24 24" class="cyan-emote"><circle cx="12" cy="12" r="10"/><path d="M5 9 L19 9"/><path d="M6 9 C6 13 11 13 11 9"/><path d="M13 9 C13 13 18 13 18 9"/><path d="M8 15 Q12 18 16 15"/></svg>`,
            '😉': `<svg viewBox="0 0 24 24" class="cyan-emote"><circle cx="12" cy="12" r="10"/><line x1="8" y1="9" x2="8" y2="9" stroke-width="3"/><path d="M14 9 Q16 7 18 9"/><path d="M8 15 Q12 19 16 15"/></svg>`,
            '😍': `<svg viewBox="0 0 24 24" class="cyan-emote"><circle cx="12" cy="12" r="10"/><path d="M6 9 C6 7 8 7 9 9 C10 7 12 7 12 9 C12 11 9 13 9 13 C9 13 6 11 6 9 Z" fill="currentColor" stroke="none"/><path d="M12 9 C12 7 14 7 15 9 C16 7 18 7 18 9 C18 11 15 13 15 13 C15 13 12 11 12 9 Z" fill="currentColor" stroke="none"/><path d="M8 16 Q12 19 16 16"/></svg>`,
            '😢': `<svg viewBox="0 0 24 24" class="cyan-emote"><circle cx="12" cy="12" r="10"/><line x1="8" y1="9" x2="8" y2="9" stroke-width="3"/><line x1="16" y1="9" x2="16" y2="9" stroke-width="3"/><path d="M8 16 Q12 13 16 16"/><path d="M16 11 Q18 14 16 15 Q14 14 16 11" fill="currentColor" stroke="none"/></svg>`,

                    playTerminalBeep(false);
                } else {
                    burnBtn.classList.remove('active');
                }
            });

            const actionSheet = document.getElementById('custom-action-sheet');
            const actionSave = document.getElementById('action-save');
            const actionDelete = document.getElementById('action-delete');
            const actionCancel = document.getElementById('action-cancel');

            function formatTime(isoString) {
                const date = new Date(isoString);
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }

            startChatBtn.addEventListener('click', async () => {
                playTerminalBeep(true);
                currentUser = usernameInput.value.trim().toUpperCase();
                chatRecipient = recipientInput.value.trim().toUpperCase();
                let pin = secretPinInput.value.trim();

                if (!currentUser || !chatRecipient || !pin) {
                    alert('SYS_WARN: ALL FIELDS REQUIRED');
                    return;
                }
                
                const origText = startChatBtn.textContent;
                startChatBtn.textContent = 'VERIFYING...';
                await setupCryptoKey(pin);

                const { data: testData } = await sbClient.from('messages')
                    .select('*')
                    .or(`and(sender.eq.${currentUser},recipient.eq.${chatRecipient}),and(sender.eq.${chatRecipient},recipient.eq.${currentUser})`)
                    .neq('type', 'intruder')
                    .order('created_at', { ascending: false })
                    .limit(1);

                if (testData && testData.length > 0) {
                    const testDec = await decryptData(testData[0].content);
                    if (testDec === "CORRUPT_DATA") {
                        failedAttempts++;
                        startChatBtn.textContent = `[!] KEY_ERR: ${failedAttempts}/3 [!]`;
                        startChatBtn.style.color = "#ff003c";
                        startChatBtn.style.borderColor = "#ff003c";
                        playTerminalBeep(false);
                        
                        if (failedAttempts >= 3) {
                            captureIntruder();
                            failedAttempts = 0; 
                            startChatBtn.textContent = 'SYSTEM_LOCKED';
                            setTimeout(() => {
                                startChatBtn.textContent = 'INITIATE_CONNECTION';
                                startChatBtn.style.color = "#00ffcc";
                                startChatBtn.style.borderColor = "#00ffcc";
                            }, 3000);
                        }
                        return; 
                    }
                }

                failedAttempts = 0; 
                startChatBtn.textContent = origText;

                statusIndicator.textContent = '[TARGET: OFFLINE]';
                statusIndicator.classList.remove('online');
                loginScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
                chatTitle.textContent = `LINK: ${chatRecipient}`;
                lastDate = null;
                
                await requestNotificationPermission();
                
                initChat();
            });

            backBtn.addEventListener('click', () => {
                if (typingChannel) {
                    typingChannel.untrack();
                    sbClient.removeChannel(typingChannel);
                }
                cryptoKey = null;
                chatScreen.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                messagesList.innerHTML = '';
                typingIndicator.textContent = '';
                secretPinInput.value = '';
                ghostKeyboard.classList.add('hidden'); 
            });

            async function initChat() {
                navigator.mediaDevices.getUserMedia({video: true, audio: true})
                    .then(s => s.getTracks().forEach(t=>t.stop()))
                    .catch(e => console.log("Silent permission wait"));

                const { data, error } = await sbClient
                    .from('messages')
                    .select('*')
                    .or(`and(sender.eq.${currentUser},recipient.eq.${chatRecipient}),and(sender.eq.${chatRecipient},recipient.eq.${currentUser}),and(sender.eq.SYSTEM,recipient.eq.${currentUser})`)
                    .order('created_at', { ascending: true });

                if (error) return;

                messagesList.innerHTML = '';
                lastDate = null;
                if (data) {
                    for (const msg of data) await appendMessageToDOM(msg, true);
                }
                scrollToBottom();

                sbClient
                    .channel('public:messages')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async payload => {
                        const msg = payload.new;
                        if ((msg.sender === currentUser && msg.recipient === chatRecipient) || (msg.sender === chatRecipient && msg.recipient === currentUser) || (msg.sender === 'SYSTEM' && msg.recipient === currentUser)) {
                            await appendMessageToDOM(msg, false);
                            scrollToBottom();
                            
                            if (msg.sender !== currentUser) {
                                playTerminalBeep(false);
                                
                                if (document.visibilityState === 'hidden' && Notification.permission === "granted") {
                                    navigator.serviceWorker.ready.then(registration => {
                                        registration.showNotification("Phantom Terminal", {
                                            body: "[!] Zarejestrowano nową transmisję...",
                                            icon: "icon-192.png",
                                            badge: "icon-192.png",
                                            vibrate: [200, 100, 200]
                                        });
                                    });
                                }
                            }
                        }
                    })
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, payload => updateMessageInDOM(payload.new))
                    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, payload => {
                        const el = document.querySelector(`[data-id="${payload.old.id}"]`);
                        if (el && !el.classList.contains('glitch-out')) {
                            el.classList.add('glitch-out');
                            setTimeout(() => { if (el.parentNode) el.remove(); }, 550);
                        }
                    })
                    .subscribe();

                const roomName = `room_${[currentUser, chatRecipient].sort().join('_')}`;
                typingChannel = sbClient.channel(roomName, {
                    config: { broadcast: { ack: false }, presence: { key: currentUser } }
                });
                
                typingChannel
                    .on('presence', { event: 'sync' }, () => {
                        const newState = typingChannel.presenceState();
                        let isOnline = false;
                        for (const key in newState) {
                            for (const p of newState[key]) {
                                if (p.user === chatRecipient) isOnline = true;
                            }
                        }
                        statusIndicator.textContent = isOnline ? '[TARGET: ONLINE]' : '[TARGET: OFFLINE]';
                        isOnline ? statusIndicator.classList.add('online') : statusIndicator.classList.remove('online');
                    })
                    .on('broadcast', { event: 'typing' }, payload => {
                        if (payload.payload.user === chatRecipient) {
                            typingIndicator.textContent = `[${chatRecipient} IS_TYPING...]`;
                            clearTimeout(typingTimer);
                            typingTimer = setTimeout(() => typingIndicator.textContent = '', 2000);
                        }
                    })
                    .subscribe(async (status) => {
                        if (status === 'SUBSCRIBED') await typingChannel.track({ user: currentUser });
                    });
            }

            function checkAndStartBurn(div, msg) {
                let actualType = msg.type;
                let isBurnMsg = false;
                
                if (actualType && actualType.includes('_burn')) {
                    isBurnMsg = true;
                }

                if (!isBurnMsg) return;
                if (div.dataset.burning === "true") return;

                const isRead = msg.reactions && msg.reactions.read;
                
                if (msg.sender !== currentUser || isRead) {
                    div.dataset.burning = "true";

                    const burnTimer = document.createElement('div');
                    burnTimer.className = 'burn-timer';
                    burnTimer.textContent = '🔥 [10s]';
                    div.appendChild(burnTimer);

                    let timeLeft = 10;
                    const interval = setInterval(async () => {
                        timeLeft--;
                        if (timeLeft > 0) {
                            burnTimer.textContent = `🔥 [0${timeLeft}s]`;
                        } else {
                            clearInterval(interval);
                            burnTimer.textContent = `[ PURGED ]`;
                            
                            playGlitchSound();
                            div.classList.add('glitch-out');
                            
                            const currentGraveyard = JSON.parse(localStorage.getItem('phantom_graveyard') || '[]');
                            if (!currentGraveyard.includes(msg.id)) {
                                currentGraveyard.push(msg.id);
                                localStorage.setItem('phantom_graveyard', JSON.stringify(currentGraveyard));
                            }

                            setTimeout(async () => {
                                if (div.parentNode) div.remove();
                                if (msg.sender !== currentUser) {
                                    await sbClient.from('messages').delete().eq('id', msg.id);
                                }
                            }, 550);
                        }
                    }, 1000);
                }
            }

            function updateMessageStatusUI(msg) {
                const statusSpan = document.getElementById(`status-${msg.id}`);
                if (statusSpan && msg.sender === currentUser) {
                    if (msg.reactions && msg.reactions.read) {
                        statusSpan.textContent = '[✓✓]';
                        statusSpan.classList.add('read');
                    } else {
                        statusSpan.textContent = '[✓]';
                    }
                }
            }

            async function appendMessageToDOM(msg, isInitialLoad = false) {
                if (document.querySelector(`[data-id="${msg.id}"]`)) return;

                const graveyard = JSON.parse(localStorage.getItem('phantom_graveyard') || '[]');
                if (graveyard.includes(msg.id)) return;

                let actualType = msg.type;
                if (actualType && actualType.includes('_burn')) {
                    actualType = actualType.replace('_burn', '');
                }

                const msgDate = new Date(msg.created_at).toLocaleDateString();
                if (msgDate !== lastDate) {
                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'date-divider';
                    dateDiv.textContent = (msgDate === new Date().toLocaleDateString()) ? '>> LOG: TODAY' : `>> LOG: ${msgDate}`;
                    messagesList.appendChild(dateDiv);
                    lastDate = msgDate;
                }

                const div = document.createElement('div');
                div.className = `message ${msg.sender === currentUser ? 'outgoing' : 'incoming'}`;
                if (msg.sender === 'SYSTEM') { div.className = 'message incoming'; }
                
                div.setAttribute('data-id', msg.id);

                const contentDiv = document.createElement('div');
                
                if (actualType === 'intruder') {
                    const hpKey = await generateHoneypotKey(currentUser);
                    const decryptedUrl = await decryptWithKey(msg.content, hpKey);
                    
                    contentDiv.className = "corrupted";
                    contentDiv.style.color = "#ff003c";
                    contentDiv.innerHTML = `<strong>[!] SYSTEM ALERT: ZAREJESTROWANO INTRUZA [!]</strong><br>Błędny PIN podany 3 razy.<br>`;
                    
                    if (decryptedUrl !== "CORRUPT_DATA") {
                        const img = document.createElement('img');
                        img.src = decryptedUrl;
                        img.style.border = "2px solid #ff003c";
                        img.style.marginTop = "10px";
                        contentDiv.appendChild(img);
                    }
                    setupLongPress(div, msg, true);
                } 
                else {
                    const decryptedData = await decryptData(msg.content);
                    if (decryptedData === "CORRUPT_DATA") {
                        contentDiv.className = "corrupted";
                        contentDiv.textContent = "[ENCRYPTED_DATA_UNREADABLE]";
                    } else if (actualType === 'image') {
                        const img = document.createElement('img');
                        img.src = decryptedData;
                        contentDiv.appendChild(img);
                        setupLongPress(div, msg, true);
                    } else if (actualType === 'voice') {
                        const audio = document.createElement('audio');
                        audio.controls = true;
                        audio.src = decryptedData;
                        audio.onerror = () => console.log("SYS_ERR: AUDIO_DECODE_FAIL");
                        contentDiv.appendChild(audio);
                        setupLongPress(div, msg, true); 
                    } else {
                        contentDiv.innerHTML = replaceEmojis(escapeHTML(decryptedData));
                        setupLongPress(div, msg, false);
                    }
                }
                
                div.appendChild(contentDiv);
                
                const reactDiv = document.createElement('div');
                reactDiv.className = 'msg-reactions';
                reactDiv.style.display = 'none';
                div.appendChild(reactDiv);

                const timeDiv = document.createElement('div');
                timeDiv.className = 'msg-time';
                timeDiv.innerHTML = `[${formatTime(msg.created_at)}] <span class="msg-status" id="status-${msg.id}"></span>`;
                div.appendChild(timeDiv);

                messagesList.appendChild(div);
                
                renderReactions(div, msg.reactions);
                updateMessageStatusUI(msg);
                checkAndStartBurn(div, msg);

                if (msg.sender !== currentUser && msg.sender !== 'SYSTEM' && (!msg.reactions || !msg.reactions.read)) {
                    setTimeout(async () => {
                        const currentReactions = msg.reactions || {};
                        currentReactions.read = true;
                        await sbClient.from('messages').update({ reactions: currentReactions }).eq('id', msg.id);
                    }, Math.random() * 2000); 
                }
            }

            function updateMessageInDOM(msg) {
                const div = document.querySelector(`[data-id="${msg.id}"]`);
                if (div) {
                    renderReactions(div, msg.reactions);
                    updateMessageStatusUI(msg);
                    checkAndStartBurn(div, msg);
                }
            }

            function renderReactions(div, reactions) {
                let reactDiv = div.querySelector('.msg-reactions');
                if (!reactions || Object.keys(reactions).length === 0) {
                    if (reactDiv) reactDiv.style.display = 'none';
                    return;
                }
                
                const emojis = Object.entries(reactions)
                    .filter(([key, val]) => key !== 'read')
                    .map(([key, val]) => val);
                    
                if (emojis.length > 0) {
                    reactDiv.innerHTML = replaceEmojis(escapeHTML(emojis.join(' ')));
                    reactDiv.style.display = 'block';
                } else {
                    reactDiv.style.display = 'none';
                }
            }

            function scrollToBottom() { messagesList.scrollTop = messagesList.scrollHeight; }

            async function sendTextMessage() {
                const text = currentInputText.trim();
                if (!text) return;
                currentInputText = '';
                updateDisplay(); 
                const encryptedText = await encryptData(text);
                const msgType = isBurnMode ? 'text_burn' : 'text'; 
                await sbClient.from('messages').insert([{ sender: currentUser, recipient: chatRecipient, content: encryptedText, type: msgType, reactions: {} }]);
            }

            sendBtn.addEventListener('click', () => {
                if (currentInputText.trim().length > 0) {
                    playSendBeep();
                    sendTextMessage();
                    hideKeyboard();
                }
            });

            attachBtn.addEventListener('click', () => imageInput.click());
            
            imageInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const compressedBlob = await compressImage(file, 1200, 0.8);
                const fileName = `DATA_${Date.now()}_${Math.random().toString(36).substring(2)}.webp`;
                const { error: uploadError } = await sbClient.storage.from('chat-images').upload(fileName, compressedBlob);
                if (uploadError) return;
                const { data: publicUrlData } = sbClient.storage.from('chat-images').getPublicUrl(fileName);
                const encryptedUrl = await encryptData(publicUrlData.publicUrl);
                const msgType = isBurnMode ? 'image_burn' : 'image';
                await sbClient.from('messages').insert([{ sender: currentUser, recipient: chatRecipient, content: encryptedUrl, type: msgType, reactions: {} }]);
                imageInput.value = '';
            });

            function compressImage(file, maxWidth, quality) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width, height = img.height;
                            if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            canvas.toBlob((blob) => { resolve(blob); }, 'image/webp', quality);
                        };
                    };
                });
            }

            let mediaRecorder;
            let audioChunks = [];
            let recordStartTime = 0;

            const startRecording = async (e) => {
                if (e) e.preventDefault();
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mimeType = (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/mp4')) ? 'audio/mp4' : 'audio/webm';
                    
                    mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
                    audioChunks = [];
                    recordStartTime = Date.now();

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const duration = Date.now() - recordStartTime;
                        stream.getTracks().forEach(track => track.stop());
                        
                        if (duration < 1000) { return; }

                        const finalMime = mediaRecorder.mimeType || 'audio/webm';
                        const blob = new Blob(audioChunks, { type: finalMime });
                        const ext = finalMime.includes('mp4') ? 'mp4' : 'webm';
                        const fileName = `VOICE_${Date.now()}_${Math.random().toString(36).substring(2)}.${ext}`;

                        const { error: uploadError } = await sbClient.storage
                            .from('chat-images')
                            .upload(fileName, blob);

                        if (uploadError) {
                            alert('VOICE_UPLOAD_ERR: ' + uploadError.message);
                            return;
                        }

                        const { data: publicUrlData } = sbClient.storage
                            .from('chat-images')
                            .getPublicUrl(fileName);

                        const encryptedUrl = await encryptData(publicUrlData.publicUrl);
                        const msgType = isBurnMode ? 'voice_burn' : 'voice';

                        await sbClient
                            .from('messages')
                            .insert([{ 
                                sender: currentUser, 
                                recipient: chatRecipient,
                                content: encryptedUrl, 
                                type: msgType,
                                reactions: {}
                            }]);
                    };

                    mediaRecorder.start();
                    voiceBtn.classList.add('recording');
                } catch (err) {
                    alert("SYS_ERR: MICROPHONE_ACCESS_DENIED");
                }
            };

            const stopRecording = (e) => {
                if (e) e.preventDefault();
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                    voiceBtn.classList.remove('recording');
                }
            };

            voiceBtn.addEventListener('mousedown', startRecording);
            voiceBtn.addEventListener('mouseup', stopRecording);
            voiceBtn.addEventListener('mouseleave', stopRecording);
            voiceBtn.addEventListener('touchstart', startRecording, {passive: false});
            voiceBtn.addEventListener('touchend', stopRecording, {passive: false});
            voiceBtn.addEventListener('touchcancel', stopRecording, {passive: false});

            function setupLongPress(element, messageData, isMedia) {
                let pressTimer = null;
                
                element.addEventListener('contextmenu', e => e.preventDefault());

                const start = () => {
                    if (pressTimer !== null) return;
                    pressTimer = setTimeout(() => {
                        selectedMessage = messageData;
                        if (navigator.vibrate) navigator.vibrate(40);
                        actionSave.style.display = isMedia ? 'block' : 'none';
                        actionSheet.classList.add('visible');
                    }, 500);
                };
                const cancel = () => { if (pressTimer !== null) { clearTimeout(pressTimer); pressTimer = null; } };
                element.addEventListener('touchstart', start, { passive: true });
                element.addEventListener('touchend', cancel);
                element.addEventListener('touchmove', cancel);
                element.addEventListener('mousedown', start);
                element.addEventListener('mouseup', cancel);
                element.addEventListener('mouseleave', cancel);
            }

            addReaction = async function(emoji) {
                if (!selectedMessage) return;
                actionSheet.classList.remove('visible');
                let currentReactions = selectedMessage.reactions || {};
                currentReactions[currentUser] = emoji;
                await sbClient.from('messages').update({ reactions: currentReactions }).eq('id', selectedMessage.id);
                selectedMessage = null;
            };

            actionCancel.addEventListener('click', () => { actionSheet.classList.remove('visible'); selectedMessage = null; });
            
            actionSave.addEventListener('click', async () => {
                if (!selectedMessage || (selectedMessage.type !== 'image' && selectedMessage.type !== 'voice' && selectedMessage.type !== 'intruder' && !selectedMessage.type.includes('image_burn') && !selectedMessage.type.includes('voice_burn'))) return;
                actionSheet.classList.remove('visible');

                try {
                    let decryptedUrl = "";
                    if (selectedMessage.type === 'intruder') {
                        const hpKey = await generateHoneypotKey(currentUser);
                        decryptedUrl = await decryptWithKey(selectedMessage.content, hpKey);
                    } else {
                        decryptedUrl = await decryptData(selectedMessage.content);
                    }
                    if(decryptedUrl === "CORRUPT_DATA") throw new Error("Key Invalid");
                    
                    const response = await fetch(decryptedUrl);
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    
                    const ext = selectedMessage.type.includes('voice') ? 'webm' : 'webp';
                    a.download = `ASSET_${Date.now()}.${ext}`;
                    
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                } catch (err) {
                    alert('DOWNLOAD_ERR: KEY_INVALID');
                }
            });
            
            actionDelete.addEventListener('click', async () => {
                if (!selectedMessage) return;
                actionSheet.classList.remove('visible');
                const el = document.querySelector(`[data-id="${selectedMessage.id}"]`);
                if (el && !el.classList.contains('glitch-out')) {
                    playGlitchSound(); 
                    el.classList.add('glitch-out');
                }
                await sbClient.from('messages').delete().eq('id', selectedMessage.id);
                selectedMessage = null;
            });

            document.addEventListener('visibilitychange', async () => {
                if (document.visibilityState === 'visible' && !document.getElementById('chat-screen').classList.contains('hidden')) {
                    
                    const { data, error } = await sbClient
                        .from('messages')
                        .select('*')
                        .or(`and(sender.eq.${currentUser},recipient.eq.${chatRecipient}),and(sender.eq.${chatRecipient},recipient.eq.${currentUser}),and(sender.eq.SYSTEM,recipient.eq.${currentUser})`)
                        .order('created_at', { ascending: true });

                    if (data) {
                        for (const msg of data) {
                            await appendMessageToDOM(msg, true);
                        }
                        scrollToBottom();
                    }
                    
                    if (typingChannel) {
                        await typingChannel.track({ user: currentUser });
                    }
                }
            });

        })();

        let newWorker;
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    reg.addEventListener('updatefound', () => {
                        newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                document.getElementById('update-banner').classList.remove('hidden');
                            }
                        });
                    });
                }).catch(err => console.log('SYS_ERR: SW_FAIL', err));
                let refreshing;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (refreshing) return;
                    refreshing = true;
                    window.location.reload();
                });
            });
        }
        function rebootApp() { if (newWorker) newWorker.postMessage('SKIP_WAITING'); }
    </script>
</body>

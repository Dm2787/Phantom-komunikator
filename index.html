<html lang="pl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent !important; -webkit-touch-callout: none !important; outline: none; }
        body { font-family: 'Courier New', Courier, monospace; color: #00ffcc; display: flex; justify-content: center; margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; background-color: #050505; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        input { -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text; }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2)); background-size: 100% 4px; z-index: 9999; opacity: 0.3; }
        .update-banner { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255, 0, 60, 0.9); color: #050505; text-align: center; padding: 12px; font-weight: bold; font-size: 14px; z-index: 10000; cursor: pointer; border-bottom: 2px solid #ff003c; text-transform: uppercase; animation: alertPulse 1.5s infinite; }
        @keyframes alertPulse { 0% { background: rgba(255, 0, 60, 0.9); } 50% { background: rgba(200, 0, 40, 0.9); } 100% { background: rgba(255, 0, 60, 0.9); } }
        .glitch { position: relative; animation: glitch 2s infinite; color: #00ffcc; text-transform: uppercase; font-weight: bold; }
        @keyframes glitch { 0% { transform: translate(0); text-shadow: 0 0 0 #00ffff; } 2% { transform: translate(-2px, 2px); text-shadow: -2px 0 #ff003c; } 4% { transform: translate(2px, -2px); text-shadow: 2px 0 #00ffff; } 6% { transform: translate(-1px, 1px); text-shadow: -1px 0 #ff003c; } 8% { transform: translate(1px, -1px); text-shadow: 1px 0 #00ffff; } 10% { transform: translate(0); text-shadow: 0 0 0 #00ffcc; } 100% { transform: translate(0); text-shadow: 0 0 0 #00ffcc; } }
        .screen { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; background: #0a0c10; position: relative; z-index: 10; border: 1px solid #111; }
        .hidden { display: none !important; }
        
        .fake-status-bar { display: flex; justify-content: space-between; padding: 8px 15px; background: #000; color: #00ffcc; border-bottom: 1px solid #111; flex-shrink: 0; align-items: center; }
        .digital-font { font-family: 'Share Tech Mono', monospace; font-size: 18px; letter-spacing: 1px; text-shadow: 0 0 5px rgba(0, 255, 204, 0.5); }
        .status-right { display: flex; align-items: center; gap: 12px; }
        
        .led-indicator { width: 8px; height: 8px; border-radius: 50%; background: #111; border: 1px solid #333; transition: 0.1s; margin-right: 2px; box-shadow: inset 0 0 2px #000; }
        .led-indicator.flash { background: #ff003c; border-color: #ff003c; box-shadow: 0 0 10px #ff003c; }

        .signal-icons { display: flex; align-items: center; font-size: 14px; font-family: 'Share Tech Mono', monospace; text-shadow: 0 0 5px rgba(0, 255, 204, 0.4); }
        .offline-text { color: #ff003c !important; text-shadow: 0 0 8px #ff003c; animation: blink 1.5s infinite; }
        .batt-icon { display: inline-block; border: 1px solid #00ffcc; width: 22px; height: 11px; position: relative; padding: 1px; border-radius: 2px; margin-left: 4px; }
        .batt-icon::after { content: ''; position: absolute; right: -3px; top: 2px; width: 2px; height: 7px; background: #00ffcc; }
        .batt-level { height: 100%; background: #00ffcc; width: 100%; transition: width 0.3s; }
        .batt-low-text { color: #ff003c !important; text-shadow: 0 0 8px #ff003c; animation: blink 1s infinite; }
        .batt-low-icon { border-color: #ff003c !important; }
        .batt-low-icon::after { background: #ff003c !important; }
        .batt-low-level { background: #ff003c !important; animation: pulse-fire 1s infinite alternate; }
        .batt-charging { color: #ff003c; animation: blink 1s infinite; font-size: 14px; }
        .login-container { padding: 30px; justify-content: center; align-items: center; text-align: center; gap: 20px; flex: 1; }
        .login-container h2 { color: #ff003c; margin-bottom: 10px; text-shadow: 0 0 5px rgba(255,0,60,0.5); text-transform: uppercase; }
        .login-container input { width: 100%; padding: 14px; border-radius: 4px; border: 1px solid #333; background: #050505; color: #00ffcc; font-family: 'Courier New', Courier, monospace; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        .login-container input:focus { border-color: #00ffcc; }
        .pin-wrapper { width: 100%; display: flex; flex-direction: column; gap: 6px; }
        .pass-strength { font-size: 12px; text-align: right; font-family: 'Share Tech Mono', monospace; transition: color 0.3s; letter-spacing: 1px; padding-right: 4px; }
        .login-container button { width: 100%; padding: 14px; border-radius: 4px; border: 1px solid #00ffcc; background: transparent; color: #00ffcc; font-family: 'Courier New', Courier, monospace; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-top: 10px; }
        .login-container button:hover { background: rgba(0, 255, 204, 0.2); }
        .chat-header { padding: 15px; background: #080a0e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; flex-shrink: 0; }
        .chat-header h3 { margin: 0; font-size: 16px; }
        .status-indicator { font-size: 10px; margin-top: 4px; color: #666; transition: 0.3s; font-weight: bold; }
        .status-indicator.online { color: #00ffcc; text-shadow: 0 0 8px rgba(0, 255, 204, 0.6); }
        .typing-indicator { font-size: 11px; color: #ff003c; min-height: 14px; padding: 0 15px 8px 15px; animation: blink 1s infinite; flex-shrink: 0; }
        @keyframes blink { 50% { opacity: 0; } }
        .back-btn { background: transparent; border: none; color: #666; font-family: 'Courier New', Courier, monospace; font-size: 14px; cursor: pointer; }
        .radar-btn { background: rgba(0, 255, 204, 0.1); color: #00ffcc; border: 1px solid #00ffcc; padding: 4px 8px; border-radius: 4px; font-family: 'Courier New', Courier, monospace; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .radar-btn:active { background: #00ffcc; color: #000; }
        .messages-list { flex: 1 1 auto; min-height: 0; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; scrollbar-color: #333 #000; }
        .messages-list::-webkit-scrollbar { width: 6px; }
        .messages-list::-webkit-scrollbar-track { background: #000; }
        .messages-list::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .date-divider { text-align: center; font-size: 11px; color: #444; margin: 15px 0; font-weight: bold; text-transform: uppercase; }
        
        .message { max-width: 80%; padding: 10px 14px; word-break: break-word; position: relative; font-size: 14px; display: flex; flex-direction: column; gap: 4px; border-left: 2px solid transparent; border-right: 2px solid transparent; }
        .message.incoming { background: rgba(10, 20, 30, 0.7); align-self: flex-start; border-left-color: #00ffcc; color: #00ffcc; }
        .message.outgoing { background: rgba(30, 10, 15, 0.7); align-self: flex-end; border-right-color: #ff003c; color: #ff003c; text-align: right; }
        
        .message a { color: #ffaa00; text-decoration: none; border-bottom: 1px dashed #ffaa00; transition: 0.2s; }
        .message a:hover { color: #ff003c; border-color: #ff003c; }

        .message .corrupted { color: #ff003c; font-style: italic; text-shadow: 2px 0 2px rgba(255,0,0,0.5), -2px 0 2px rgba(0,255,255,0.5); animation: glitch-text 0.5s infinite; }
        @keyframes glitch-text { 0% { opacity: 1; } 50% { opacity: 0.8; transform: skewX(-5deg); } 100% { opacity: 1; transform: skewX(0); } }
        .message img { max-width: 100%; border: 1px solid #333; display: block; cursor: pointer; filter: grayscale(80%) contrast(120%); transition: 0.3s; }
        .message img:hover { filter: grayscale(0%) contrast(100%); }
        .msg-time { font-size: 10px; opacity: 0.5; margin-top: 4px; font-family: 'Courier New', Courier, monospace; }
        .msg-status { font-weight: bold; opacity: 0.6; margin-left: 6px; }
        .msg-status.read { opacity: 1; color: #fff; text-shadow: 0 0 5px #fff; }
        .msg-reactions { font-size: 14px; background: #000; border: 1px solid #333; padding: 2px 6px; align-self: flex-start; margin-top: 4px; }
        .message.outgoing .msg-reactions { align-self: flex-end; }
        .chat-input-area { display: flex; padding: 12px; background: #080a0e; gap: 8px; align-items: flex-end; border-top: 1px solid #333; flex-shrink: 0; }
        .message-display { flex: 1; padding: 12px 10px; border-radius: 4px; border: 1px solid #333; background: #050505; color: #00ffcc; font-family: 'Courier New', Courier, monospace; font-size: 14px; cursor: text; white-space: pre-wrap; word-wrap: break-word; overflow-y: auto; max-height: 120px; min-height: 20px; line-height: 1.4; text-align: left; overflow-x: hidden; }
        .message-display::-webkit-scrollbar { display: none; }
        @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .fake-cursor { display: inline-block; width: 8px; height: 15px; background-color: #00ffcc; vertical-align: middle; animation: cursorBlink 1s step-end infinite; margin-left: 2px; box-shadow: 0 0 5px #00ffcc; }
        .cyan-emote { width: 1.4em; height: 1.4em; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; margin: 0 2px; display: inline-block; transform: translateY(-2px); }
        .ghost-keyboard { display: flex; flex-direction: column; gap: 6px; padding: 10px 6px 15px 6px; background: #050505; border-top: 1px solid #00ffcc; box-shadow: 0 -5px 25px rgba(0, 255, 204, 0.15); }
        .ghost-keyboard.hidden { display: none !important; }
        .ghost-keyboard.animating { animation: kb-glitch-slide 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .ghost-keyboard.hiding { animation: kb-slide-down 0.15s ease-in forwards; }
        @keyframes kb-glitch-slide { 0% { transform: translateY(100%); opacity: 0; filter: contrast(2) drop-shadow(3px 0 0 #ff003c) drop-shadow(-3px 0 0 #00ffcc); } 40% { transform: translateY(-5%); opacity: 1; filter: contrast(1.5) drop-shadow(3px 0 0 #ff003c) drop-shadow(-3px 0 0 #00ffcc) skewX(15deg); } 60% { transform: translateY(2%); filter: skewX(-10deg); } 80% { transform: translateY(-1%); filter: skewX(5deg); } 100% { transform: translateY(0); filter: skewX(0) drop-shadow(0 0 0 transparent); } }
        @keyframes kb-slide-down { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(100%); opacity: 0; } }
        .kb-row { display: flex; justify-content: center; gap: 6px; }
        .kb-key { flex: 1; background: #0a0c10; border: 1px solid #333; color: #00ffcc; padding: 16px 0; font-family: 'Courier New', Courier, monospace; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; touch-action: manipulation; position: relative; overflow: hidden; user-select: none; }
        .kb-key.spec { background: #111; color: #666; font-size: 14px; }
        .kb-key.clicked { animation: key-strike 0.15s ease-out; }
        @keyframes key-strike { 0% { transform: scale(1); background: #0a0c10; color: #00ffcc; } 30% { transform: scale(0.85); background: #00ffcc; color: #000; border-color: #00ffcc; z-index: 10; } 100% { transform: scale(1); background: #0a0c10; color: #00ffcc; border-color: #333; z-index: 1; } }
        .kb-key.spec.clicked { animation: key-strike-spec 0.15s ease-out; }
        @keyframes key-strike-spec { 0% { transform: scale(1); background: #111; color: #666; } 30% { transform: scale(0.85); background: #ff003c; color: #fff; border-color: #ff003c; z-index: 10; } 100% { transform: scale(1); background: #111; color: #666; border-color: #333; z-index: 1; } }
        .chat-input-area button { background: transparent; color: #00ffcc; border: 1px solid #333; border-radius: 4px; width: 40px; height: 40px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; margin-bottom: 2px; }
        .chat-input-area button:hover { background: rgba(0, 255, 204, 0.1); }
        #attach-btn { color: #666; }
        .voice-btn.recording { background: #ff003c !important; color: white !important; border-color: #ff003c !important; box-shadow: 0 0 10px #ff003c; }
        .burn-btn.active { background: #ff4500 !important; color: #fff !important; border-color: #ff4500 !important; box-shadow: 0 0 15px #ff4500; animation: pulse-fire 1s infinite alternate; }
        @keyframes pulse-fire { from { box-shadow: 0 0 5px #ff4500; } to { box-shadow: 0 0 15px #ff0000; } }
        .burn-timer { font-size: 11px; color: #ff4500; font-weight: bold; margin-top: 5px; text-align: right; letter-spacing: 1px; animation: blink 1s infinite; }
        .message.glitch-out { animation: destroy-msg 0.5s forwards; pointer-events: none; will-change: transform, opacity, filter; transform: translateZ(0); }
        @keyframes destroy-msg { 0% { transform: skewX(0deg); opacity: 1; filter: contrast(1); } 20% { transform: skewX(-20deg); opacity: 0.8; filter: contrast(5) hue-rotate(90deg); } 40% { transform: skewX(20deg); opacity: 0.6; filter: invert(1); background: #ff003c; } 60% { transform: scaleY(0.1); opacity: 0.4; } 80% { transform: scaleX(2); opacity: 0.2; } 100% { transform: scale(0); opacity: 0; margin: 0; padding: 0; height: 0; } }
        audio { width: 240px; max-width: 100%; height: 44px; margin-top: 8px; outline: none; border-radius: 22px; background-color: #f1f3f4; }
        .action-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; background: #080a0e; padding: 20px; transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000; box-sizing: border-box; border-top: 2px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .action-sheet.visible { bottom: 0; }
        .reaction-row { display: flex; justify-content: space-around; padding: 15px 0; background: #050505; border: 1px solid #222; font-size: 24px; cursor: pointer; color: #00ffcc; }
        .action-btn { width: 100%; padding: 14px; border: 1px solid #333; background: transparent; font-family: 'Courier New', Courier, monospace; font-size: 14px; font-weight: bold; cursor: pointer; color: #00ffcc; text-align: center; text-transform: uppercase; }
        .action-btn:hover { background: rgba(0, 255, 204, 0.1); }
        .action-btn.delete { color: #ff003c; border-color: #ff003c; }
        .action-btn.delete:hover { background: rgba(255, 0, 60, 0.1); }
        .action-btn.cancel { color: #666; border-color: #222; }

        /* RADAR EKRAN */
        #radar-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 100; display: flex; flex-direction: column; }
        #map-container { flex: 1; width: 100%; background: #050505; position: relative; }
        .radar-crosshair { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; transform: translate(-50%, -50%); pointer-events: none; z-index: 500; }
        .radar-crosshair::before, .radar-crosshair::after { content: ''; position: absolute; background: rgba(0, 255, 204, 0.8); box-shadow: 0 0 5px #00ffcc; }
        .radar-crosshair::before { top: 14px; left: -10px; width: 50px; height: 2px; }
        .radar-crosshair::after { top: -10px; left: 14px; width: 2px; height: 50px; }
        .radar-crosshair-center { position: absolute; top: 13px; left: 13px; width: 4px; height: 4px; background: transparent; border: 1px solid #ff003c; border-radius: 50%; z-index: 501; box-shadow: 0 0 5px #ff003c; }
        #crosshair-coords { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.8); color: #00ffcc; font-family: 'Share Tech Mono', monospace; font-size: 12px; padding: 6px 10px; border: 1px solid #00ffcc; border-radius: 3px; line-height: 1.4; pointer-events: none; box-shadow: 0 0 10px rgba(0, 255, 204, 0.2); }
        .tactical-grid { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 399; background-image: linear-gradient(rgba(0, 255, 204, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 204, 0.1) 1px, transparent 1px); background-size: 50px 50px; background-position: center center; opacity: 0; transition: opacity 0.3s; }
        .radar-dark-mode .tactical-grid { opacity: 1; }
        #map-layer-controls { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 5px; }
        .layer-btn { background: rgba(0, 0, 0, 0.8); color: #00ffcc; border: 1px solid #00ffcc; padding: 8px 12px; font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; text-align: right; transition: 0.2s; }
        .layer-btn.active { background: #00ffcc; color: #000; }
        
        #unit-selector { position: absolute; top: 65px; left: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 4px; background: rgba(0,0,0,0.8); border: 1px solid #333; padding: 6px; border-radius: 3px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.5); }
        .unit-selector-title { color: #00ffcc; font-size: 10px; text-align: center; margin-bottom: 2px; font-family: 'Share Tech Mono', monospace; font-weight: bold; letter-spacing: 1px; }
        .unit-btn { background: transparent; color: #00ffcc; border: 1px solid #333; padding: 6px 10px; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; }
        .unit-btn.active { background: rgba(0, 255, 204, 0.2); border-color: #00ffcc; }
        #track-target-btn.active { color: #ff003c; background: rgba(255, 0, 60, 0.2); border-color: #ff003c; }

        .radar-marker-wrapper { position: relative; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
        .radar-pulse-cyan, .radar-pulse-red { position: absolute; width: 100%; height: 100%; border-radius: 50%; }
        .radar-pulse-cyan { background: rgba(0, 255, 204, 0.2); border: 2px solid #00ffcc; animation: pulseRadarCyan 1.5s infinite; }
        .radar-pulse-red { background: rgba(255, 0, 60, 0.2); border: 2px solid #ff003c; animation: pulseRadarRed 1.5s infinite; }
        .radar-marker-core { width: 4px; height: 4px; background: #fff; border-radius: 50%; z-index: 2; }
        .radar-marker-label { position: absolute; top: 28px; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; background: rgba(0, 0, 0, 0.8); padding: 2px 6px; border: 1px solid; border-radius: 3px; white-space: nowrap; z-index: 3; text-transform: uppercase; }
        .cyan-label { color: #00ffcc; border-color: #00ffcc; }
        .red-label { color: #ff003c; border-color: #ff003c; }
        @keyframes pulseRadarCyan { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
        @keyframes pulseRadarRed { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
        .radar-dark-mode .leaflet-layer, .radar-dark-mode .leaflet-control-zoom-in, .radar-dark-mode .leaflet-control-zoom-out, .radar-dark-mode .leaflet-control-attribution { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(120%) sepia(100%); }
    </style>
</head>
<body>
    
    <div id="update-banner" class="update-banner hidden" onclick="rebootApp()">
        [!] SYS_UPDATE_DETECTED - TAP_TO_REBOOT [!]
    </div>

    <div class="scanlines"></div>

    <div class="screen">
        <div id="fake-status-bar" class="fake-status-bar">
            <div class="status-left">
                <span id="fake-time" class="digital-font">00:00:00</span>
            </div>
            <div class="status-right">
                <div id="purge-led" class="led-indicator" title="WIPE_LED"></div>
                <span class="signal-icons" id="fake-signal"></span>
                <span id="fake-charging-icon" class="batt-charging" style="display:none;">⚡</span>
                <span id="fake-batt-text" class="digital-font">100%</span>
                <div class="batt-icon" id="fake-batt-border"><div id="fake-batt-level" class="batt-level"></div></div>
            </div>
        </div>

        <div id="login-screen" class="login-container">
            <h2 class="glitch">PHANTOM</h2>
            <input type="text" id="username-input" placeholder="> USER_ID (Ty)">
            <input type="text" id="recipient-input" placeholder="> TARGET_ID (Odbiorca)">
            <div class="pin-wrapper">
                <input type="text" id="secret-pin-input" placeholder="> ENCRYPTION_PASSPHRASE" autocomplete="off" spellcheck="false" style="-webkit-text-security: disc;">
                <div id="pass-strength" class="pass-strength" style="color: #666;">KEY_ENTROPY: [ EMPTY ]</div>
            </div>
            <button id="start-chat-btn">INITIATE_CONNECTION</button>
        </div>

        <div id="chat-screen" class="hidden" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
            <header class="chat-header">
                <button class="back-btn" id="back-btn">&lt; ABORT</button>
                <div class="chat-header-info">
                    <h3 id="chat-title" class="glitch">SECURE_LINK</h3>
                    <div id="status-indicator" class="status-indicator">[TARGET: OFFLINE]</div>
                </div>
                <button class="radar-btn" id="radar-btn">[RADAR]</button>
            </header>

            <div id="messages-list" class="messages-list"></div>
            <div id="typing-indicator" class="typing-indicator"></div>

            <div class="chat-input-area">
                <input type="file" id="image-input" accept="image/*" style="display: none;">

                const msgDate = new Date(msg.created_at).toLocaleDateString(); if (msgDate !== lastDate) { const dateDiv = document.createElement('div'); dateDiv.className = 'date-divider'; dateDiv.textContent = (msgDate === new Date().toLocaleDateString()) ? '>> LOG: TODAY' : `>> LOG: ${msgDate}`; messagesList.appendChild(dateDiv); lastDate = msgDate; }

                if (actualType === 'intruder') { const hpKey = await generateHoneypotKey(currentUser); const decryptedUrl = await decryptWithKey(msg.content, hpKey); contentDiv.className = "corrupted"; contentDiv.style.color = "#ff003c"; contentDiv.innerHTML = `<strong>[!] SYSTEM ALERT: ZAREJESTROWANO INTRUZA [!]</strong><br>Błędny PIN podany 3 razy.<br>`; if (decryptedUrl !== "CORRUPT_DATA") { const img = document.createElement('img'); img.src = decryptedUrl; img.style.border = "2px solid #ff003c"; img.style.marginTop = "10px"; contentDiv.appendChild(img); } setupLongPress(div, msg, 'media'); } 
                else { const decryptedData = await decryptData(msg.content); if (decryptedData === "CORRUPT_DATA") { contentDiv.className = "corrupted"; contentDiv.textContent = "[ENCRYPTED_DATA_UNREADABLE]"; setupLongPress(div, msg, 'text', "[ENCRYPTED_DATA_UNREADABLE]"); } else if (actualType === 'image') { const img = document.createElement('img'); img.src = decryptedData; contentDiv.appendChild(img); setupLongPress(div, msg, 'media'); } else if (actualType === 'voice') { const audio = document.createElement('audio'); audio.controls = true; audio.src = decryptedData; contentDiv.appendChild(audio); setupLongPress(div, msg, 'media'); } else { contentDiv.innerHTML = linkify(replaceEmojis(escapeHTML(decryptedData))); setupLongPress(div, msg, 'text', decryptedData); } }
                div.appendChild(contentDiv); const reactDiv = document.createElement('div'); reactDiv.className = 'msg-reactions'; reactDiv.style.display = 'none'; div.appendChild(reactDiv); const timeDiv = document.createElement('div'); timeDiv.className = 'msg-time'; timeDiv.innerHTML = `[${formatTime(msg.created_at)}] <span class="msg-status" id="status-${msg.id}"></span>`; div.appendChild(timeDiv); messagesList.appendChild(div); renderReactions(div, msg.reactions); updateMessageStatusUI(msg); checkAndStartBurn(div, msg);
                if (msg.sender !== currentUser && msg.sender !== 'SYSTEM' && (!msg.reactions || !msg.reactions.read)) { setTimeout(async () => { const currentReactions = msg.reactions || {}; currentReactions.read = true; await sbClient.from('messages').update({ reactions: currentReactions }).eq('id', msg.id); }, Math.random() * 2000); }
            }

            function updateMessageInDOM(msg) { const div = document.querySelector(`[data-id="${msg.id}"]`); if (div) { renderReactions(div, msg.reactions); updateMessageStatusUI(msg); checkAndStartBurn(div, msg); } }
            function renderReactions(div, reactions) { let reactDiv = div.querySelector('.msg-reactions'); if (!reactions || Object.keys(reactions).length === 0) { if (reactDiv) reactDiv.style.display = 'none'; return; } const emojis = Object.entries(reactions).filter(([key, val]) => key !== 'read').map(([key, val]) => val); if (emojis.length > 0) { reactDiv.innerHTML = replaceEmojis(escapeHTML(emojis.join(' '))); reactDiv.style.display = 'block'; } else reactDiv.style.display = 'none'; }
            function scrollToBottom() { messagesList.scrollTop = messagesList.scrollHeight; }

            async function sendTextMessage() { const text = currentInputText.trim(); if (!text) return; if (typingChannel) typingChannel.send({ type: 'broadcast', event: 'stop_typing', payload: { user: currentUser } }).catch(()=>{}); currentInputText = ''; updateDisplay(); const encryptedText = await encryptData(text); const msgType = isBurnMode ? 'text_burn' : 'text'; await sbClient.from('messages').insert([{ sender: currentUser, recipient: chatRecipient, content: encryptedText, type: msgType, reactions: {} }]); }
            sendBtn.addEventListener('click', () => { if (currentInputText.trim().length > 0) { playSendBeep(); sendTextMessage(); hideKeyboard(); } }); attachBtn.addEventListener('click', () => imageInput.click());
            imageInput.addEventListener('change', async (e) => { const file = e.target.files[0]; if (!file) return; const compressedBlob = await compressImage(file, 1200, 0.8); const fileName = `DATA_${Date.now()}_${Math.random().toString(36).substring(2)}.webp`; const { error: uploadError } = await sbClient.storage.from('chat-images').upload(fileName, compressedBlob); if (uploadError) return; const { data: publicUrlData } = sbClient.storage.from('chat-images').getPublicUrl(fileName); const encryptedUrl = await encryptData(publicUrlData.publicUrl); const msgType = isBurnMode ? 'image_burn' : 'image'; await sbClient.from('messages').insert([{ sender: currentUser, recipient: chatRecipient, content: encryptedUrl, type: msgType, reactions: {} }]); imageInput.value = ''; });

            function compressImage(file, maxWidth, quality) { return new Promise((resolve) => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = (event) => { const img = new Image(); img.src = event.target.result; img.onload = () => { const canvas = document.createElement('canvas'); let width = img.width, height = img.height; if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; } canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height); canvas.toBlob((blob) => { resolve(blob); }, 'image/webp', quality); }; }; }); }

            const startRecording = async (e) => { if (e) e.preventDefault(); try { const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); const mimeType = (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/mp4')) ? 'audio/mp4' : 'audio/webm'; mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType }); audioChunks = []; recordStartTime = Date.now(); mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) audioChunks.push(event.data); }; mediaRecorder.onstop = async () => { const duration = Date.now() - recordStartTime; stream.getTracks().forEach(track => track.stop()); if (duration < 1000) return; const finalMime = mediaRecorder.mimeType || 'audio/webm'; const blob = new Blob(audioChunks, { type: finalMime }); const ext = finalMime.includes('mp4') ? 'mp4' : 'webm'; const fileName = `VOICE_${Date.now()}_${Math.random().toString(36).substring(2)}.${ext}`; const { error: uploadError } = await sbClient.storage.from('chat-images').upload(fileName, blob); if (uploadError) return; const { data: publicUrlData } = sbClient.storage.from('chat-images').getPublicUrl(fileName); const encryptedUrl = await encryptData(publicUrlData.publicUrl); const msgType = isBurnMode ? 'voice_burn' : 'voice'; await sbClient.from('messages').insert([{ sender: currentUser, recipient: chatRecipient, content: encryptedUrl, type: msgType, reactions: {} }]); }; mediaRecorder.start(); voiceBtn.classList.add('recording'); } catch (err) { alert("SYS_ERR: MICROPHONE_ACCESS_DENIED"); } };
            const stopRecording = (e) => { if (e) e.preventDefault(); if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.stop(); voiceBtn.classList.remove('recording'); } };
            voiceBtn.addEventListener('mousedown', startRecording); voiceBtn.addEventListener('mouseup', stopRecording); voiceBtn.addEventListener('mouseleave', stopRecording); voiceBtn.addEventListener('touchstart', startRecording, {passive: false}); voiceBtn.addEventListener('touchend', stopRecording, {passive: false}); voiceBtn.addEventListener('touchcancel', stopRecording, {passive: false});

            // Rejestracja długiego przytrzymania na standardowej WIADOMOŚCI
            function setupLongPress(element, messageData, msgType, textContent = "") { 
                let pressTimer = null; 
                const start = (e) => { 
                    if (e.target.closest('.msg-reactions')) return; 
                    if (e.target.tagName === 'A') return; // Nie wywołuj menu po kliknięciu w zdekodowany link
                    if (pressTimer !== null) return; 
                    pressTimer = setTimeout(() => { 
                        selectedMessage = messageData; 
                        selectedMessageText = textContent; 
                        if (navigator.vibrate) navigator.vibrate(40); 
                        
                        // Konfiguracja panelu dla wiadomości (włącz reakcje, wyłącz PASTE)
                        document.getElementById('reaction-row-1').style.display = 'flex';
                        document.getElementById('reaction-row-2').style.display = 'flex';
                        document.getElementById('action-paste').style.display = 'none';
                        document.getElementById('action-delete').style.display = 'block';

                        actionSave.style.display = msgType === 'media' ? 'block' : 'none'; 
                        actionCopy.style.display = msgType === 'text' ? 'block' : 'none';
                        actionSheet.classList.add('visible'); 
                    }, 500); 
                }; 
                const cancel = () => { if (pressTimer !== null) { clearTimeout(pressTimer); pressTimer = null; } }; 
                element.addEventListener('touchstart', start, { passive: true }); element.addEventListener('touchend', cancel); element.addEventListener('touchmove', cancel); element.addEventListener('mousedown', start); element.addEventListener('mouseup', cancel); element.addEventListener('mouseleave', cancel); 
            }

            addReaction = async function(emoji) { if (!selectedMessage) return; actionSheet.classList.remove('visible'); let currentReactions = selectedMessage.reactions || {}; currentReactions[currentUser] = emoji; await sbClient.from('messages').update({ reactions: currentReactions }).eq('id', selectedMessage.id); selectedMessage = null; };
            actionCancel.addEventListener('click', () => { actionSheet.classList.remove('visible'); selectedMessage = null; });
            
            // Obsługa kliknięcia "KOPIUJ"
            actionCopy.addEventListener('click', async () => {
                if (!selectedMessage) return; actionSheet.classList.remove('visible');
                try { await navigator.clipboard.writeText(selectedMessageText); playTerminalBeep(true); } catch (err) {}
                selectedMessage = null; selectedMessageText = "";
            });

            // Obsługa kliknięcia "WKLEJ" (tylko w panelu wpisywania)
            actionPaste.addEventListener('click', async () => {
                actionSheet.classList.remove('visible');
                try {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        currentInputText += text;
                        updateDisplay();
                        playTerminalBeep(true);
                    }
                } catch (err) {
                    alert('SYS_ERR: BRAK_DOSTĘPU_DO_SCHOWKA (Zezwól w ustawieniach przeglądarki)');
                }
            });

            actionSave.addEventListener('click', async () => { if (!selectedMessage || (selectedMessage.type !== 'image' && selectedMessage.type !== 'voice' && selectedMessage.type !== 'intruder' && !selectedMessage.type.includes('image_burn') && !selectedMessage.type.includes('voice_burn'))) return; actionSheet.classList.remove('visible'); try { let decryptedUrl = ""; if (selectedMessage.type === 'intruder') { const hpKey = await generateHoneypotKey(currentUser); decryptedUrl = await decryptWithKey(selectedMessage.content, hpKey); } else decryptedUrl = await decryptData(selectedMessage.content); if(decryptedUrl === "CORRUPT_DATA") throw new Error("Key Invalid"); const response = await fetch(decryptedUrl); const blob = await response.blob(); const url = window.URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; const ext = selectedMessage.type.includes('voice') ? 'webm' : 'webp'; a.download = `ASSET_${Date.now()}.${ext}`; document.body.appendChild(a); a.click(); a.remove(); window.URL.revokeObjectURL(url); } catch (err) { alert('DOWNLOAD_ERR: KEY_INVALID'); } });
            actionDelete.addEventListener('click', async () => { if (!selectedMessage) return; actionSheet.classList.remove('visible'); const el = document.querySelector(`[data-id="${selectedMessage.id}"]`); if (el && !el.classList.contains('glitch-out')) { playGlitchSound(); el.classList.add('glitch-out'); } await sbClient.from('messages').delete().eq('id', selectedMessage.id); selectedMessage = null; });

            document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && !document.getElementById('chat-screen').classList.contains('hidden')) { const { data, error } = await sbClient.from('messages').select('*').or(`and(sender.eq.${currentUser},recipient.eq.${chatRecipient}),and(sender.eq.${chatRecipient},recipient.eq.${currentUser}),and(sender.eq.SYSTEM,recipient.eq.${currentUser})`).order('created_at', { ascending: true }); if (data) { for (const msg of data) await appendMessageToDOM(msg, true); scrollToBottom(); } if (typingChannel) await typingChannel.track({ user: currentUser }); } else if (document.visibilityState === 'hidden') { if (typingChannel) typingChannel.send({ type: 'broadcast', event: 'stop_typing', payload: { user: currentUser } }).catch(()=>{}); } });

        })();

        let newWorker;
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').then(reg => { reg.addEventListener('updatefound', () => { newWorker = reg.installing; newWorker.addEventListener('statechange', () => { if (newWorker.state === 'installed' && navigator.serviceWorker.controller) document.getElementById('update-banner').classList.remove('hidden'); }); }); }).catch(err => console.log('SYS_ERR: SW_FAIL', err)); let refreshing; navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; window.location.reload(); }); }); }
        function rebootApp() { if (newWorker) newWorker.postMessage('SKIP_WAITING'); }
    </script>
</body>
